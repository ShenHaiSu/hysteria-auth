server {
    listen 443 ssl http2;
    server_name master.example.com;

    ssl_certificate /etc/ssl/certs/hysteria-auth.crt;
    ssl_certificate_key /etc/ssl/private/hysteria-auth.key;

    # === 方案 A（默认）：ASP.NET Core 托管 SPA 静态文件 ===
    # 所有请求透传到 Kestrel，由 UseStaticFiles + MapFallbackToFile 处理
    # 无需额外 Nginx 配置

    # === 方案 B：Nginx 直接托管 SPA 静态文件（如需启用，请取消下方注释） ===
    # 注意：若使用方案 B，需将 appsettings.json 中 Spa.Enabled 设为 false
    #
    # location / {
    #     root /opt/hysteria-auth/master/wwwroot;
    #     try_files $uri $uri/ /index.html;
    #
    #     # 静态资源长缓存
    #     location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
    #         expires 1d;
    #         add_header Cache-Control "public, immutable";
    #     }
    # }

    # 健康检查（无需认证，不走日志）
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        access_log off;
    }

    # 认证 API（Edge Agent 调用）
    location /api/v1/auth/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理 API
    location /api/v1/admin/ {
        # 可配置 IP 白名单
        # allow 192.168.1.0/24;
        # deny all;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 用户管理 API
    location /api/v1/users/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 节点 API
    location /api/v1/nodes/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
